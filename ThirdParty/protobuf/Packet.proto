syntax = "proto3";

package HProtocol;

message Chat
{
	string msg = 1;
}

message MatchPlayer
{
	uint32 playerCharacter = 1;
}

message MatchReady
{
	uint32 maxPlayer = 1;
	uint32 isServer = 2;
	string killerIP = 3;
	uint32 killerCharacter = 4;
	repeated string survivorIP = 5;
	repeated uint32 survivorCharacter = 6;
}

